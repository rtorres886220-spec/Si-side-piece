<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Si</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400&family=Geist+Mono:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="sidekickPanel" class="sidekick-panel">
    <!-- Deep Vibrant Midnight Blue Ambient Glow -->
    <div class="ambient-glow" aria-hidden="true"></div>

    <!-- Rolls-Royce Starlight Headliner on Lower Half -->
    <div id="rrStarlightCeiling" class="rr-starlight-ceiling" aria-hidden="true">
      <div class="rr-shooting-star-track">
        <div class="rr-shooting-star"></div>
      </div>
      <div id="rrStarsContainer" class="rr-stars-container"></div>
    </div>

    <!-- Minimal Header Pushed Right Up to Top Edge -->
    <header class="header">
      <div id="wordmarkWrapper" class="wordmark-wrapper" title="Click to rename">
        <span id="wordmarkS">S</span><span id="wordmarkUper" class="wordmark-foldable">uper </span><span id="wordmarkI">I</span><span id="wordmarkNtelligence" class="wordmark-foldable">ntelligence</span>
        <span id="wordmarkDot" class="wordmark-sparkle hidden"></span>
      </div>
      <input type="text" id="renameInput" class="rename-input hidden" placeholder="Name..." />

      <div class="header-actions">
        <button id="newChatBtn" class="icon-btn" title="New chat" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button id="historyBtn" class="icon-btn" title="Chat history" aria-label="Chat history">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- History Drawer (Minimal overlay) -->
    <section id="historyDrawer" class="drawer hidden">
      <div class="drawer-header">
        <span class="drawer-title">History</span>
        <button id="closeHistoryBtn" class="drawer-close" aria-label="Close history">&times;</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>

    <!-- Settings Drawer (Minimal overlay) -->
    <section id="settingsDrawer" class="drawer hidden">
      <div class="drawer-header">
        <span class="drawer-title">Settings</span>
        <button id="closeSettingsBtn" class="drawer-close" aria-label="Close settings">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="field-group">
          <label for="apiKeyInput" class="field-label">
            Gemini API Key
            <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="subtle-link">Get key ↗</a>
          </label>
          <div class="input-row">
            <input 
              type="password" 
              id="apiKeyInput" 
              class="flat-input" 
              placeholder="AIzaSy..." 
              autocomplete="off" 
              spellcheck="false"
            />
            <button id="toggleKeyVisibilityBtn" type="button" class="text-toggle-btn">show</button>
          </div>
          <span class="field-caption">Stored in local Chrome storage. Never sent to third parties.</span>
        </div>

        <div class="field-group">
          <label for="modelSelect" class="field-label">Model</label>
          <select id="modelSelect" class="flat-select">
            <option value="gemini-3.8-flash" selected>gemini-3.8-flash (Recommended)</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
          </select>
        </div>

        <div class="drawer-actions">
          <button id="saveSettingsBtn" class="action-btn">Save</button>
          <span id="saveStatus" class="save-indicator"></span>
        </div>
      </div>
    </section>

    <!-- Thread Container -->
    <main id="threadContainer" class="thread-container">
      <!-- Empty State (Left-aligned, bottom of thread) -->
      <div id="emptyState" class="empty-state">
        <h1 class="empty-headline">
          What should we<br>
          <span class="headline-mute">do with this page?</span>
        </h1>
        <p class="empty-subline">
          Try <button type="button" class="empty-action-btn" data-prompt="Summarize this page">summarize</button>, <button type="button" class="empty-action-btn" data-prompt="Find the action items on this page">find the action items</button>, or <button type="button" class="empty-action-btn" data-prompt="Explain this page simply">explain it simply</button>.
        </p>
      </div>

      <!-- Messages Thread -->
      <div id="messagesList" class="messages-list"></div>
    </main>

    <!-- Composer Section -->
    <footer class="composer-section">
      <!-- Selection Banner (One-line quote above textarea) -->
      <div id="selectionBanner" class="selection-quote hidden">
        <span class="selection-quote-text" id="selectionQuoteText"></span>
        <button id="clearSelectionBtn" class="selection-quote-close" title="Clear selection" aria-label="Clear selection">&times;</button>
      </div>

      <!-- Human-in-the-Loop (HITL) Safety Gate Modal -->
      <div id="safetyModal" class="safety-gate hidden">
        <div class="safety-gate-header">
          <span class="safety-gate-badge">Action Approval Required</span>
          <span id="safetyStepBadge" class="safety-step-count">Step 1 of 5</span>
        </div>
        <p id="safetyActionDesc" class="safety-gate-desc"></p>
        <div class="safety-gate-actions">
          <button type="button" id="approveActionBtn" class="safety-btn approve">Approve Action</button>
          <button type="button" id="denyActionBtn" class="safety-btn deny">Deny &amp; Stop</button>
        </div>
      </div>

      <!-- Rounded Composer Box with Choreographic Conic Border -->
      <div id="composerBox" class="composer-box">
        <!-- Ultra-thin choreographic conic gradient - midnight with cyan blue hint, no off glow -->
        <div class="choreo-conic-border" aria-hidden="true">
          <div class="choreo-conic-inner"></div>
        </div>

        <form id="chatForm" class="composer-form">
          <textarea 
            id="promptInput" 
            class="composer-textarea" 
            placeholder="Ask or automate…" 
            rows="1" 
            maxlength="8000"
          ></textarea>

          <!-- Minimal Bottom Row: Send Button -->
          <div class="composer-bottom-row">
            <div class="send-wrapper">
              <button type="submit" id="sendBtn" class="send-btn" title="Send" aria-label="Send">
                <svg id="sendIconSvg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
                <span id="stopIconSquare" class="stop-square hidden"></span>
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Reserved slot for future small subtext below input box -->
      <div id="composerSubtextSlot" class="composer-subtext-slot"></div>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
